<!doctype html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Slots</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24103c,#09070e 65%);color:#fff;font:16px Arial;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#121019;border:2px solid #c99a3b;border-radius:25px;padding:25px;box-shadow:0 0 35px #000}h1{text-align:center;color:#f4c85b;margin:0 0 5px}.sub{text-align:center;color:#aaa;margin-bottom:20px}.balance{background:#09080d;padding:14px;border-radius:12px;text-align:center;font-size:20px}.balance b{color:#6dff9b}.reels{display:flex;gap:10px;justify-content:center;margin:20px 0}.reel{width:110px;height:115px;background:#f5f0df;color:#111;border:5px solid #b8862c;border-radius:17px;display:grid;place-items:center;font-size:60px}input,button{border:0;border-radius:11px;padding:13px;font-size:16px}input{width:110px;text-align:center}button{cursor:pointer;font-weight:bold;background:#e7b94e}.wide{width:100%;margin-top:10px}.secondary{background:#24202c;color:#fff}.msg{min-height:50px;margin-top:15px;background:#0a0910;border-radius:11px;padding:13px;color:#ddd}.row{display:flex;gap:10px;align-items:center;justify-content:center;margin:15px 0}.sandbox{margin-top:18px;padding:10px;border:1px dashed #8c6c2c;border-radius:10px;text-align:center;color:#f4c85b;font-size:13px}
</style></head><body><div class="card"><h1>🎰 NEON SLOTS</h1><div class="sub">Demo — Revolut Sandbox</div><div class="balance">Sold virtual: <b>€<span id="bal">100.00</span></b></div><div class="reels"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">🍋</div><div class="reel" id="r3">🔔</div></div><div class="row">Miză <input id="bet" type="number" min="1" value="5"></div><button class="wide" id="spin">SPIN 🎰</button><div class="row"><input id="deposit" type="number" min="1" value="20"><button onclick="deposit()">DEPUNERE SANDBOX</button></div><button class="wide secondary" onclick="withdraw()">RETRAGERE DEMO</button><div class="msg" id="msg">Poți testa jocul fără bani reali.</div><div class="sandbox">⚠️ REVOLUT SANDBOX — tranzacții de test</div></div>
<script>
let balance=Number(localStorage.getItem("neon_slots_balance")||"100"),busy=false;const s=["🍒","🍋","🔔","⭐","7️⃣"],$=id=>document.getElementById(id);function update(){$("bal").textContent=balance.toFixed(2)}
$("spin").onclick=()=>{if(busy)return;const bet=+$("bet").value;if(bet<1||bet>balance)return $("msg").textContent="Miză invalidă.";balance-=bet;update();busy=true;$("spin").disabled=true;$("msg").textContent="Rolele se învârt...";let n=0,t=setInterval(()=>{[$("r1"),$("r2"),$("r3")].forEach(x=>x.textContent=s[Math.floor(Math.random()*s.length)]);if(++n>=14){clearInterval(t);let a=[0,1,2].map(()=>s[Math.floor(Math.random()*s.length)]);[$("r1"),$("r2"),$("r3")].forEach((x,i)=>x.textContent=a[i]);let same=a[0]==a[1]&&a[1]==a[2],pair=new Set(a).size===2,m=same?(a[0]=="7️⃣"?50:a[0]=="⭐"?20:a[0]=="🔔"?12:a[0]=="🍒"?10:8):(pair?2:0),win=bet*m;balance+=win;update();$("msg").textContent=m?`🎉 Câștig €${win.toFixed(2)} (${m}×)`:"😔 Nu ai câștigat.";busy=false;$("spin").disabled=false}},90)};
async function deposit(){const amount=+$("deposit").value;if(amount<1)return;$("msg").textContent="Se creează ordinul Revolut Sandbox...";try{const r=await fetch("/.netlify/functions/revolut-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount})}),d=await r.json();if(!r.ok)throw new Error(d.error||"Eroare Revolut");if(d.checkout_url)location.href=d.checkout_url;else $("msg").textContent=`Ordin Sandbox creat: ${d.id||"OK"}`}catch(e){$("msg").textContent=e.message}}
function withdraw(){$("msg").textContent="Retragerea este simulată local. Nu se trimit bani reali."}
</script>
<script>
(function () {
  const params = new URLSearchParams(location.search);

  if (params.get("payment") === "success") {
    const pending = Number(localStorage.getItem("pending_deposit") || "0");

    if (pending > 0) {
      const oldBalance = Number(localStorage.getItem("neon_slots_balance") || "100");
      const newBalance = oldBalance + pending;

      localStorage.setItem("neon_slots_balance", String(newBalance));
      localStorage.removeItem("pending_deposit");

      history.replaceState({}, "", location.pathname);

      setTimeout(() => {
        location.reload();
      }, 300);
    }
  }

  const originalFetch = window.fetch;

  window.fetch = async function (...args) {
    const response = await originalFetch.apply(this, args);

    try {
      const url = String(args[0] || "");

      if (url.includes("/.netlify/functions/revolut-order")) {
        const clone = response.clone();
        const data = await clone.json();

        if (data && data.checkout_url) {
          const body = typeof args[1]?.body === "string"
            ? JSON.parse(args[1].body)
            : null;

          const amount = Number(body?.amount || 0);

          if (amount > 0) {
            localStorage.setItem("pending_deposit", String(amount));
          }
        }
      }
    } catch (e) {}

    return response;
  };
})();
</script>

</body></html>
